name: ci

# Ch 13: the main gate. Runs on every push to main and every PR.
# Layer order matters (cheapest/fastest first): fmt -> build+sizes -> unit/fuzz/invariant
# (seeded) -> gas snapshot -> coverage -> SAST. Fork tests live in fork.yml (RPC-gated).

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the built-in token (Ch 13 supply-chain convention):
# the default GITHUB_TOKEN has `contents: write` — scope it down to read.
permissions:
  contents: read

# One in-flight run per ref; a new push cancels the stale run (wasted-minutes control).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci        # foundry.toml [profile.ci] — pinned fuzz seed
  FOUNDRY_FUZZ_SEED: "1234"  # belt-and-suspenders: env var wins over config

jobs:
  gate:
    name: Gate (fmt / build / test / gas / SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # never leave a usable token in .git

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Format check
        run: forge fmt --check

      - name: Build + contract sizes
        # --sizes fails the build on EIP-170 (24 KB) violations — the gate Ch 14's
        # MeridianToken and Ch 20's MeridianVault must pass.
        run: forge build --sizes

      - name: Unit + fuzz + invariant (seeded, fail_on_revert)
        # Seed pinned via env; [invariant] fail_on_revert = true is in foundry.toml.
        # Fork tests skip themselves when MAINNET_RPC_URL is unset (Ch 11) — the PR
        # gate stays RPC-free; the real fork layer runs in fork.yml.
        run: forge test -vvv

      - name: Gas snapshot gate
        # Fails if any deterministic test's gas moves by more than 20 units vs
        # the committed .gas-snapshot. Fuzz/invariant rows are excluded
        # (--no-match-test) — forge 1.7.x μ rows are not byte-stable across
        # invocations even with a pinned seed (Ch 13/14 finding). Fork tests
        # are excluded too (--no-match-path): they skip to gas 0 without RPC
        # and their rows behave differently across forge versions; the fork
        # layer runs in fork.yml without a snapshot gate. --check prints the
        # diff on failure (--diff is not combinable with --check in forge 1.7.x).
        run: forge snapshot --check --tolerance 20 --no-match-test "\([^)]|invariant_" --no-match-path "test/*Fork*"

      - name: Coverage
        # Gas-probe tests (test_gas_*, testTouch*) assert gasleft() deltas —
        # coverage instrumentation inflates gas and breaks those assertions
        # (Ch 1/2 methodology note: instrumentation distorts gasleft() tests).
        run: forge coverage --report summary --no-match-test "gas|Touch"

      - name: Slither (protocol surface)
        # Lab/probe contracts are filtered via slither.config.json; findings are
        # triaged in the PR, not mass-excluded. --fail-high: only High-severity
        # findings fail the gate (slither 0.11.x default fail-on is pedantic —
        # the old fail_pedantic config key is no longer recognized; low/info
        # findings print to the log for review without failing).
        run: slither . --config-file slither.config.json --fail-high

      - name: Install Aderyn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cyfrin/aderyn/releases/latest/download/aderyn-installer.sh | bash
          aderyn --version

      - name: Aderyn (protocol surface)
        # Lab/probe contracts are filtered via aderyn.toml (same philosophy as
        # slither.config.json filter_paths); findings are triaged in the PR.
        # NOTE: the old `--config aderyn.toml` flag was REMOVED in aderyn 0.6.x
        # (clap usage error: "Usage: aderyn <ROOT>") — the config file is now
        # auto-loaded from the project root when present. Keep `aderyn .`; if a
        # future release breaks the CLI again, the version line printed by the
        # Install step will show which version drifted (pin via cyfrinup if needed).
        run: aderyn .
