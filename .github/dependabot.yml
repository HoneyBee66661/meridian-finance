# Ch 13 — dependabot for the GitHub Actions supply chain.
# Actions are pinned by full commit SHA in workflow files (see docs/ci-cd-playbook.md);
# dependabot keeps those pins current with reviewable PRs instead of `@v1` floats.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
