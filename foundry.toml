[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read", path = "./"}]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
# Ch 12: a reverting sequence fails the run instead of silently no-op'ing.
# Handlers must pre-check every revert edge so sequences stay valid.
fail_on_revert = true

# Ch 13: CI profile — pinned fuzz seed so any red run in CI replays byte-identically
# (Ch 12 seed-replay convention, now enforced by the pipeline, not by discipline).
# The workflow also sets FOUNDRY_FUZZ_SEED (env var wins) as belt-and-suspenders.
[profile.ci.fuzz]
seed = "0x00000000000000000000000000000000000000000000000000000000000004d2"

[fmt]
line_length = 100
